<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Royal Game of Ur">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#26281f" />
      <stop offset="55%" stop-color="#1b1d18" />
      <stop offset="100%" stop-color="#131410" />
    </radialGradient>
    <linearGradient id="crown" x1="256" y1="130" x2="256" y2="306" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f3e0af" />
      <stop offset="45%" stop-color="#d9b268" />
      <stop offset="48%" stop-color="#d0aa63" />
      <stop offset="100%" stop-color="#a98341" />
    </linearGradient>
    <linearGradient id="ur" x1="256" y1="348" x2="256" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f4efe2" />
      <stop offset="100%" stop-color="#cfc8b6" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e6c27f" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#c7a65d" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#c7a65d" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" />
    </filter>
  </defs>

  <!-- plate -->
  <rect width="512" height="512" rx="114" fill="url(#bg)" />
  <rect x="2" y="2" width="508" height="508" rx="112" fill="none" stroke="#c7a65d" stroke-opacity="0.3" stroke-width="2" />

  <!-- warm halo behind the crown -->
  <ellipse cx="256" cy="212" rx="176" ry="140" fill="url(#halo)" />

  <!-- faint game board behind -->
  <g stroke="#c7a65d" stroke-opacity="0.22" fill="none" stroke-width="2.5">
    <rect x="150" y="250" width="46" height="46" rx="6" />
    <rect x="200" y="250" width="46" height="46" rx="6" />
    <rect x="316" y="250" width="46" height="46" rx="6" />
    <rect x="366" y="250" width="30" height="46" rx="6" />
    <rect x="116" y="250" width="30" height="46" rx="6" />
  </g>
  <g fill="#c7a65d" fill-opacity="0.18">
    <circle cx="173" cy="273" r="4" />
    <circle cx="339" cy="273" r="4" />
  </g>

  <!-- crown glow -->
  <path filter="url(#soft)" opacity="0.55"
    d="M150 300 L150 262 L168 180 L190 232 L212 156 L234 212 L256 134 L278 212 L300 156 L322 232 L344 180 L362 262 L362 300 Z"
    fill="#e6c680" />

  <!-- crown -->
  <path
    d="M150 300 L150 262 L168 180 L190 232 L212 156 L234 212 L256 134 L278 212 L300 156 L322 232 L344 180 L362 262 L362 300 Z"
    fill="url(#crown)" stroke-linejoin="round" />
  <path
    d="M150 300 L150 262 L168 180 L190 232 L212 156 L234 212 L256 134 L278 212 L300 156 L322 232 L344 180 L362 262 L362 300 Z"
    fill="none" stroke="#f6e6b4" stroke-opacity="0.7" stroke-width="3" stroke-linejoin="round" />

  <!-- crown band -->
  <rect x="150" y="266" width="212" height="34" rx="6" fill="#1b1d18" fill-opacity="0.28" />
  <line x1="150" y1="283" x2="362" y2="283" stroke="#7a5f2b" stroke-opacity="0.5" stroke-width="2" />

  <!-- peak jewels -->
  <g fill="#f6e6b4">
    <circle cx="168" cy="180" r="6" />
    <circle cx="212" cy="156" r="6.5" />
    <circle cx="256" cy="134" r="8" />
    <circle cx="300" cy="156" r="6.5" />
    <circle cx="344" cy="180" r="6" />
  </g>
  <!-- band jewels -->
  <g fill="#a7cad7">
    <circle cx="200" cy="283" r="5.5" />
    <circle cx="256" cy="283" r="6.5" />
    <circle cx="312" cy="283" r="5.5" />
  </g>

  <!-- wordmark -->
  <text x="256" y="428" text-anchor="middle" fill="#e6c680" fill-opacity="0.28" filter="url(#soft)"
    font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="600"
    letter-spacing="6">UR</text>
  <text x="256" y="428" text-anchor="middle" fill="url(#ur)"
    font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="600"
    letter-spacing="6">UR</text>
</svg>
