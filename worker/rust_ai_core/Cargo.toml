[package]
name = "rgou-ai-core"
version = "1.0.0"
edition = "2021"
authors = ["Robert Gilks"]
description = "Royal Game of Ur AI core logic"
license = "MIT"
repository = "https://github.com/tre-systems/rgou-cloudflare"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "train"
path = "src/bin/train.rs"
required-features = ["training"]

[[bin]]
name = "evolve_params"
path = "src/bin/evolve_params.rs"
required-features = ["training"]

[features]
default = ["training"]
wasm = [
    "wasm-bindgen",
    "console_error_panic_hook",
    "getrandom/wasm_js",
    "dep:js-sys",
    "dep:serde-wasm-bindgen",
    "dep:web-sys",
]
training = ["dep:chrono", "dep:rayon"]
slow_tests = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9.2"
getrandom = "0.4"
wasm-bindgen = { version = "0.2.100", optional = true }
serde-wasm-bindgen = { version = "0.6.5", optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["console"] }
ndarray = "0.15"
chrono = { version = "0.4", features = ["serde"], optional = true }
rayon = { version = "1.8", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
